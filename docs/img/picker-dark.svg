<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 928" width="1000" height="928" role="img" aria-labelledby="t d"><title id="t">Which llm-cpp header solves which problem</title><desc id="d">Sixteen common tasks, each mapped to the one or two single-header files that do it. Green headers need only the C++ standard library; orange headers also need libcurl.</desc>
