# Builds and tests the CMake package (vendored headers in include/llm/) on pushes
# to the default branch that change code, and on merge requests.
stages: [test]

test:
  stage: test
  image: gcc:13
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: ["include/**/*", "tests/**/*", "examples/**/*", "cmake/**/*", "CMakeLists.txt", "tools/**/*", ".gitlab-ci.yml"]
  script:
    - apt-get update -qq && apt-get install -y -qq cmake libcurl4-openssl-dev
    - cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/prefix
    - cmake --build build --parallel 4
    - ctest --test-dir build --output-on-failure
    - cmake --install build
    - cmake -S tests/consumer -B build-consumer -DCMAKE_PREFIX_PATH=$PWD/prefix -DCONSUMER_WITH_CURL=ON
    - cmake --build build-consumer
    - ctest --test-dir build-consumer --output-on-failure
