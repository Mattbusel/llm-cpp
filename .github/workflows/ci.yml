name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  offline-examples:
    name: Build and run offline examples (g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch current headers
        run: |
          mkdir -p third_party
          for lib in cache cost guard json format compress; do
            curl -fsSL -o third_party/llm_$lib.hpp \
              https://raw.githubusercontent.com/Mattbusel/llm-$lib/main/include/llm_$lib.hpp
          done
      - name: Build, run, compare with committed output
        run: |
          mkdir -p build
          for lib in cache cost guard json format compress; do
            g++ -std=c++17 -O2 -Wall -Ithird_party examples/offline/$lib.cpp -o build/$lib
            ./build/$lib > build/$lib.txt
            diff -u examples/offline/output/$lib.txt build/$lib.txt
            echo "ok: $lib"
          done
  site:
    name: Site is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild docs/index.html and check for drift
        run: |
          python tools/build_site.py
          git diff --exit-code docs/index.html
  link-all:
    name: All 26 implementations compile and link together (g++, libcurl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libcurl
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev
      - name: Fetch headers, compile each implementation, link one binary
        run: |
          mkdir -p third_party build/impl
          python3 -c "import json;[print(l['name'], l['macro']) for l in json.load(open('tools/libraries.json'))['libraries']]" > libs.txt
          while read name macro; do
            file=$(echo "${name#llm-}" | tr - _)
            curl -fsSL -o "third_party/llm_$file.hpp" \
              "https://raw.githubusercontent.com/Mattbusel/$name/main/include/llm_$file.hpp"
            printf '#define %s\n#include "llm_%s.hpp"\n' "$macro" "$file" > "build/impl/$file.cpp"
            g++ -std=c++17 -O1 -Ithird_party -c "build/impl/$file.cpp" -o "build/impl/$file.o"
          done < libs.txt
          echo 'int main() { return 0; }' > build/main.cpp
          g++ -std=c++17 build/main.cpp build/impl/*.o -lcurl -lpthread -o build/all26
          ./build/all26 && echo "linked $(ls build/impl/*.o | wc -l) implementations"
