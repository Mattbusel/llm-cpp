name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
# The headers, examples and package are built and tested in cmake.yml.
jobs:
  site:
    name: Site is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild docs/index.html and check for drift
        run: |
          python tools/build_site.py
          git diff --exit-code docs/index.html
